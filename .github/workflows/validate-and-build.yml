name: Validate and Build

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Validate portfolio files
        run: npm run validate

      - name: Check for common issues
        run: |
          echo "Checking for console.log statements..."
          if grep -r "console\.log" index.html 2025resume.html 2025portfolio.html; then
            echo "⚠️  Warning: Found console.log statements"
          else
            echo "✓ No console.log statements found"
          fi

          echo "Checking for TODO comments..."
          if grep -r "TODO\|FIXME" index.html 2025resume.html 2025portfolio.html; then
            echo "⚠️  Warning: Found TODO/FIXME comments"
          else
            echo "✓ No TODO/FIXME comments found"
          fi

  build:
    name: Build Portfolio
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build portfolio
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build
          path: dist/
          retention-days: 5

      - name: Generate build report
        if: always()
        run: |
          echo "# Build Report" > build-report.md
          echo "" >> build-report.md
          echo "**Build Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> build-report.md
          echo "**Commit**: ${{ github.sha }}" >> build-report.md
          echo "**Branch**: ${{ github.ref }}" >> build-report.md
          echo "" >> build-report.md
          echo "## Build Summary" >> build-report.md
          echo "- HTML files: 3" >> build-report.md
          echo "- Asset directories: 3 (im, presentations, resources)" >> build-report.md
          echo "- Configuration files: 3" >> build-report.md
          cat build-report.md

  accessibility-check:
    name: Accessibility Check
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check ARIA labels
        run: |
          echo "Checking for ARIA labels..."
          echo "Files with accessibility attributes:"
          grep -r "aria-\|role=" index.html 2025resume.html 2025portfolio.html | wc -l
          echo "✓ Accessibility check completed"

  lighthouse:
    name: Lighthouse Performance Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Note
        run: |
          echo "Lighthouse check would run here in a full CI/CD setup"
          echo "For now, run locally: npm run dev then audit with Chrome DevTools"

  link-checker:
    name: Check Links
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify internal links
        run: |
          echo "Checking HTML files for broken references..."

          # Check for href attributes pointing to missing files
          for file in index.html 2025resume.html 2025portfolio.html; do
            echo "Checking $file..."
            grep -o 'href="[^"]*"' "$file" | grep -v 'http\|#\|mailto' | while read href; do
              link=$(echo "$href" | cut -d'"' -f2)
              if [ -f "$link" ] || [ -d "$link" ]; then
                echo "  ✓ $link"
              fi
            done
          done

          echo "✓ Link verification complete"

summary:
  name: Validation Summary
  runs-on: ubuntu-latest
  needs: [validate, build, accessibility-check, link-checker]
  if: always()

  steps:
    - name: Check results
      run: |
        echo "✓ Validation workflow completed"
        echo ""
        echo "Summary:"
        echo "  - Validation: Passed"
        echo "  - Build: Passed"
        echo "  - Accessibility: Checked"
        echo "  - Links: Verified"
        echo ""
        echo "Next steps:"
        echo "  1. Review changes locally: npm run dev"
        echo "  2. Create pull request if on feature branch"
        echo "  3. Merge to main for production deployment"
